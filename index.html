<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <title>MessageBox</title>
        <style>
            /* 响应式基础重置 */
            html,body{
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
                font-family: Arial, Helvetica, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            /* 根变量：可按需调整 */
            :root{
                /* 弹窗宽度在 160px - 260px 之间，优先使用 20vw */
                --box-width: clamp(160px, 20vw, 260px);
                /* 弹窗高度在 80px - 140px 之间，优先使用 12vh */
                --box-height: clamp(80px, 12vh, 140px);
                --box-radius: 8px;
                --box-shadow: 0 0 10px rgba(0,0,0,0.12);
                --title-padding: 6px 10px;
                --content-padding: 10px;
            }

            .mainClassName {
                position: relative;
                width: 100%;
                height: 100%;
                overflow: hidden; /* 防止弹窗超出可视区 */
                box-sizing: border-box;
            }

            /* 添加弹出动画的关键帧 */
            @keyframes popup {
                0% {
                    transform: scale(0) translate(-50%, -50%);
                    opacity: 0;
                }
                50% {
                    transform: scale(1.06) translate(-50%, -50%);
                }
                100% {
                    transform: scale(1) translate(-50%, -50%);
                    opacity: 1;
                }
            }

            /* 弹窗主体：尺寸与圆角、阴影统一由 CSS 控制（响应式） */
            .message-box {
                position: absolute; /* 由 JS 动态设置 left/top */
                width: var(--box-width);
                height: var(--box-height);
                box-shadow: var(--box-shadow);
                border-radius: var(--box-radius);
                overflow: hidden;
                background-clip: padding-box;
                display: flex;
                flex-direction: column;
                animation: popup 0.28s ease-out forwards;
                transform-origin: center center;
                /* 初始使用 translate(-50%,-50%) 以便动画与定位配合 */
                transform: translate(-50%, -50%);
            }

            .message-title{
                color: #fff;
                border-bottom: 1px solid rgba(255,255,255,0.08);
                padding: var(--title-padding);
                font-weight: 600;
                font-size: 0.95rem;
            }

            .message-content{
                background-color: #fff;
                padding: var(--content-padding);
                color: #333;
                flex: 1 1 auto;
                font-size: 0.9rem;
                word-break: break-word;
                display: flex;
                align-items: center;
            }

            /* 小屏优化：更紧凑的内边距与字体 */
            @media (max-width: 420px) {
                :root{
                    --title-padding: 4px 8px;
                    --content-padding: 8px;
                }
                .message-box{ border-radius: 6px; }
                .message-title{ font-size: 0.85rem; }
                .message-content{ font-size: 0.85rem; }
            }
        </style>
    </head>
    <body>
        <div id="main" class="mainClassName"></div>
    </body>
    <script>
        // 信息框内容
        var content = ["hhhh","ahahdoqwl","ashdfidfiq","eyrfkbjdkbjf"]
        var main = document.getElementById("main")

        // 系统区域与中心点（会在 resize 时更新）
        var systemRect = { width: main.clientWidth, height: main.clientHeight };
        var centerX = systemRect.width / 2;
        var centerY = systemRect.height / 2;

        var index = 0;
        var intervalId;

        function updateSystemRect(){
            systemRect.width = main.clientWidth;
            systemRect.height = main.clientHeight;
            centerX = systemRect.width / 2;
            centerY = systemRect.height / 2;
        }

        // 监听窗口大小变化
        window.addEventListener('resize', function() {
            updateSystemRect();
        });

        // 初始化信息框（每隔一段时间出现一个）
        function createMessageBox(){
            // 先确保系统尺寸是最新的
            updateSystemRect();
            intervalId = setInterval(() => {
                if (index >= content.length) {
                    clearInterval(intervalId);
                    return 0;
                }

                // 每次创建前更新尺寸（以应对动态布局）
                updateSystemRect();

                // 从 CSS 变量读取当前弹窗计算宽高（clamp 的最终像素值）
                var rootStyles = getComputedStyle(document.documentElement);
                var boxW = parseFloat(rootStyles.getPropertyValue('--box-width')) || 200;
                var boxH = parseFloat(rootStyles.getPropertyValue('--box-height')) || 100;

                // 计算安全的随机偏移量，确保弹窗不会超出主区域
                var maxXRange = Math.max(0, systemRect.width - boxW);
                var maxYRange = Math.max(0, systemRect.height - boxH);
                const backgroundColor = bgcolor();
                const x = (Math.random() - 0.5) * maxXRange;
                const y = (Math.random() - 0.5) * maxYRange;

                createMessage(content[index], x, y, index, backgroundColor);
                index++;
            },2000)
        }

        // 信息框主体：不再在 JS 中设置宽高，交给 CSS 管理
        function createMessage(text, x, y, idx, backgroundColor) {
            const div = document.createElement("div")
            div.id = "messageBox" + idx
            div.className = "message-box"

            // 初始位置为中心（使用 left/top 与 translate(-50%,-50%) 组合保持中心对齐）
            div.style.left = `${centerX}px`;
            div.style.top = `${centerY}px`;

            const titleEl = messageTitle(backgroundColor);
            const contentEl = messageBox(text, backgroundColor);

            div.appendChild(titleEl);
            div.appendChild(contentEl);

            main.appendChild(div);

            // 设置最终位置，让动画生效（短延迟以触发 transition/animation）
            setTimeout(() => {
                div.style.left = `${centerX + x}px`;
                div.style.top = `${centerY + y}px`;
            }, 10);
            return div;
        }

        // 信息标题框（颜色动态）
        function messageTitle(backgroundColor) {
            const div = document.createElement("div")
            div.textContent = "嘻嘻"
            div.className = "message-title";
            // 仅覆盖动态颜色，样式交给 CSS 管理
            div.style.backgroundColor = backgroundColor;
            div.style.color = '#fff';
            return div;
        }

        // 信息内容框（颜色动态）
        function messageBox(text, backgroundColor) {
            const div = document.createElement("div")
            div.textContent = text
            div.className = "message-content"
            // 内容文字使用同色（或可自行调整以保证可读性）
            div.style.color = backgroundColor;
            return div;
        }

        // 随机颜色
        function bgcolor() {
            return `rgb(${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)},${Math.floor(Math.random()*255)})`
        }

        // 启动
        createMessageBox()
    </script>
</html>
